<title>Recebemos seu briefing · B2donto</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;700;800&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet">
<style>
/* mesmo visual da tela "Recebemos!" do planejamento2027.html */
:root{
  --cyan:#00E1C3; --black-hole:#050922; --off-white:#E8EAF5; --cool-grey:#9AA0C4;
  --grad-brand:linear-gradient(135deg,#00E1C3 0%,#4A6CF7 45%,#A713B9 100%);
  --font:'Sora',system-ui,-apple-system,sans-serif;
  --mono:'JetBrains Mono',ui-monospace,Menlo,monospace;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{background:var(--black-hole); min-height:100vh}
body{font-family:var(--font); color:var(--off-white); line-height:1.55; -webkit-font-smoothing:antialiased; overflow:hidden; height:100vh}
body::before{
  content:""; position:fixed; inset:0; z-index:0; pointer-events:none;
  background:
    radial-gradient(900px 700px at 85% -5%, rgba(0,225,195,.14), transparent 60%),
    radial-gradient(800px 700px at -10% 30%, rgba(167,19,185,.12), transparent 60%),
    radial-gradient(900px 700px at 50% 108%, rgba(74,108,247,.10), transparent 60%);
}
.frame{position:fixed; inset:16px; z-index:100; pointer-events:none}
.frame .corner{position:absolute; width:14px; height:14px; opacity:.7}
.frame .corner svg{width:100%; height:100%; display:block}
.frame .corner.tl{top:0; left:0} .frame .corner.tr{top:0; right:0}
.frame .corner.bl{bottom:0; left:0} .frame .corner.br{bottom:0; right:0}
.header{position:fixed; top:32px; left:32px; z-index:200; display:flex; align-items:center; gap:12px}
.header .logo{font-weight:800; font-size:22px; color:#fff; line-height:1; letter-spacing:-.02em}
.header .logo span{font-weight:400; opacity:.7}
.header .badge{font-family:var(--mono); font-size:10px; letter-spacing:2px; color:var(--cyan); text-transform:uppercase; border:1px solid rgba(0,225,195,.4); padding:3px 8px; border-radius:4px}
@media (max-width:768px){.header{top:20px; left:20px}}
.stage{position:relative; z-index:10; height:100vh; height:100dvh; display:flex; align-items:center; justify-content:center; padding:120px 32px 80px}
.qoutro{text-align:center; max-width:760px}
.qoutro .check{width:88px; height:88px; margin:0 auto 28px; border-radius:50%; background:var(--grad-brand); display:grid; place-items:center; font-size:40px; color:var(--black-hole); font-weight:900; box-shadow:0 24px 60px rgba(0,225,195,.4); animation:pop .6s cubic-bezier(.2,1.4,.5,1) both}
@keyframes pop{from{transform:scale(.5); opacity:0} to{transform:scale(1); opacity:1}}
.qoutro h1{font-size:clamp(36px, 5vw, 56px); font-weight:800; letter-spacing:-.02em; margin-bottom:16px}
.qoutro p{font-size:16px; color:var(--cool-grey); max-width:520px; margin:0 auto 32px; line-height:1.6}
</style>
</head>
<body>
<div class="frame">
  <div class="corner tl"><svg viewBox="0 0 14 14" fill="none"><path d="M0 0H6V1H1V6H0V0Z" fill="#00E1C3"/></svg></div>
  <div class="corner tr"><svg viewBox="0 0 14 14" fill="none"><path d="M14 0H8V1H13V6H14V0Z" fill="#00E1C3"/></svg></div>
  <div class="corner bl"><svg viewBox="0 0 14 14" fill="none"><path d="M0 14H6V13H1V8H0V14Z" fill="#00E1C3"/></svg></div>
  <div class="corner br"><svg viewBox="0 0 14 14" fill="none"><path d="M14 14H8V13H13V8H14V14Z" fill="#00E1C3"/></svg></div>
</div>
<div class="header">
  <div class="logo">B2<span>donto</span></div>
  <span class="badge">DIAGNÓSTICO</span>
</div>
<main class="stage">
  <div class="qoutro">
    <div class="check">✓</div>
    <h1>Recebemos seu briefing.</h1>
    <p>Em <b>poucas horas</b> você recebe no WhatsApp o diagnóstico completo da sua presença digital, com o plano de ação personalizado pra sua clínica.</p>
  </div>
</main>
</body>
</html>
