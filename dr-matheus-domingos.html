<style>
:root{--cyan:#00E1C3; --black-hole:#050922; --off-white:#E8EAF5; --cool-grey:#9AA0C4; --danger:#FF7090}
*{box-sizing:border-box; margin:0}
body{min-height:100vh; min-height:100dvh; display:grid; place-items:center; padding:24px 16px; color:var(--off-white);
  font-family:'Sora',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif; -webkit-font-smoothing:antialiased;
  background:radial-gradient(70% 45% at 50% 0%, rgba(167,19,185,.28), transparent 70%),
             radial-gradient(60% 40% at 50% 100%, rgba(0,225,195,.14), transparent 70%), var(--black-hole)}
main{width:100%; max-width:400px; text-align:center}
.logo{width:44px; height:44px; filter:drop-shadow(0 0 16px rgba(0,225,195,.5)); margin-bottom:28px}
.kicker{font-family:'JetBrains Mono',ui-monospace,Menlo,monospace; font-size:11px; letter-spacing:3px; text-transform:uppercase; color:var(--cyan)}
h1{font-size:clamp(26px,7vw,34px); line-height:1.15; font-weight:700; margin:10px 0 14px}
p{color:var(--cool-grey); font-size:15px; line-height:1.55}
form{margin-top:28px; display:grid; gap:12px}
input{width:100%; padding:16px; border-radius:14px; border:1px solid rgba(255,255,255,.16); background:rgba(255,255,255,.04);
  color:var(--off-white); font:600 22px/1 'JetBrains Mono',ui-monospace,Menlo,monospace; letter-spacing:6px; text-align:center; outline:none}
input::placeholder{letter-spacing:2px; color:var(--cool-grey); font-weight:400}
input:focus{border-color:var(--cyan); box-shadow:0 0 0 3px rgba(0,225,195,.18)}
button{padding:16px; border:0; border-radius:14px; background:var(--cyan); color:var(--black-hole); font:700 16px 'Sora',system-ui,sans-serif; cursor:pointer}
button:disabled{opacity:.6; cursor:wait}
.msg{min-height:44px; margin-top:14px; font-size:14px; line-height:1.5; color:var(--danger)}
</style>
</head>
