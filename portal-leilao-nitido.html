<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Portal do Aluno, Leilao de Veiculos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;500;600;700&family=Courier+Prime:wght@400;700&display=swap" rel="stylesheet">
<style>
/* =========================================================================
   SISTEMA VISUAL, MODO CLARO ("claro nitido")
   Paleta DERIVADA da escura da casa (curso-297.html): mesma familia de hue,
   papel quente tingido no ambar. Nunca branco azulado, nunca cinza de template.
   ========================================================================= */
:root{
  /* papel: 6 superficies, do mais claro ao mais quente. Mesma logica da
     escura, invertida. Na escura a temperatura sobe conforme caminha pra
     oferta; aqui tambem, --p-gold e so upgrade. */
  --p-card:#FFFFFF;     /* so card elevado */
  --p-base:#FAF8F4;     /* o chao do portal */
  --p-soft:#F5F1E9;
  --p-warm:#F0EADC;
  --p-ember:#EBE3D1;
  --p-gold:#F7EEDA;     /* o mais quente: so upgrade e oferta */

  /* tinta tingida no ambar, nunca preto puro. Mesma escada de 5 da escura. */
  --ink-1:#1A150C; --ink-2:#3D3527; --ink-3:#5E5442; --ink-4:#8A7F68; --ink-5:#B5AB94;

  /* acento: em papel o ambar claro nao tem contraste pra texto, entao sao
     dois. --accent carrega texto e borda, --accent-fill so preenche botao. */
  --accent:#9A7414;        /* texto, link, borda, numero de etapa. Contraste AA no papel */
  --accent-fill:#E8C86A;   /* SO o fill do botao principal, com --btn-text por cima */
  --accent-soft:#F5E6BE;   /* wash de fundo, badge, destaque */
  --btn-text:#14100A;
  --ok:#3F7D4E; --danger:#B03E28;

  --line:rgba(26,21,12,.10);
  --line-2:rgba(154,116,20,.20);

  --font:'Sora',system-ui,-apple-system,sans-serif;
  --mono:'Courier Prime',monospace;

  /* escada tipografica: tamanho : tracking : peso : entrelinha.
     O tracking negativo forte e a assinatura premium da casa. Nao afrouxar. */
  --t-mega:clamp(32px,5.2vw,52px); --tr-mega:-.055em; --w-mega:600; --lh-mega:1.08;
  --t-h2:clamp(24px,3vw,34px);     --tr-h2:-.05em;    --w-h2:550;   --lh-h2:1.14;
  --t-h3:19px;                     --tr-h3:-.04em;    --w-h3:600;   --lh-h3:1.3;
  --t-body:15px;                   --tr-body:-.012em; --w-body:400; --lh-body:1.7;
  --t-micro:10px;                  --tr-micro:.12em;  --w-micro:600; --lh-micro:1.6;

  /* profundidade vem de LINHA e de um degrau de papel, nao de sombra pesada.
     Duas sombras no sistema inteiro, e so isso. */
  --sh-1:0 1px 2px rgba(26,21,12,.04);
  --sh-2:0 8px 24px rgba(26,21,12,.05);

  /* raio contido: 10 a 14px. Raio grande demais infantiliza ferramenta de trabalho. */
  --r:12px; --r-sm:10px; --r-lg:14px;

  --sidebar:272px;
}

*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  font-family:var(--font);
  background:var(--p-base);
  color:var(--ink-2);
  font-size:var(--t-body);letter-spacing:var(--tr-body);line-height:var(--lh-body);
  font-weight:var(--w-body);
  -webkit-font-smoothing:antialiased;
  /* mobile-first de verdade: nada de largura fixa em lugar nenhum */
  overflow-x:hidden;
}
h1,h2,h3,h4{margin:0;color:var(--ink-1)}
p{margin:0}
a{color:var(--accent);text-decoration:none}
button{font:inherit;letter-spacing:inherit;cursor:pointer;border:0;background:none;color:inherit}
input,textarea{font:inherit;letter-spacing:inherit;color:inherit}

/* foco visivel em tudo que recebe foco. Sem isso o portal e inutilizavel no teclado. */
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}

.h1{font-size:var(--t-mega);letter-spacing:var(--tr-mega);font-weight:var(--w-mega);line-height:var(--lh-mega)}
.h2{font-size:var(--t-h2);letter-spacing:var(--tr-h2);font-weight:var(--w-h2);line-height:var(--lh-h2)}
.h3{font-size:var(--t-h3);letter-spacing:var(--tr-h3);font-weight:var(--w-h3);line-height:var(--lh-h3)}
/* caixa alta SO abaixo de 12px. Acima disso vira grito. */
.micro{font-size:var(--t-micro);letter-spacing:var(--tr-micro);font-weight:var(--w-micro);
  line-height:var(--lh-micro);text-transform:uppercase;color:var(--ink-4)}
.mono{font-family:var(--mono)}
.dim{color:var(--ink-3)}
.dim-2{color:var(--ink-4)}

/* =========================================================================
   SHELL: sidebar fixa a esquerda, sempre visivel no desktop.
   No celular ela vira gaveta sobre o conteudo.
   ========================================================================= */
.shell{display:block}
.topbar{
  display:flex;align-items:center;gap:12px;
  padding:10px 14px;background:var(--p-card);
  border-bottom:1px solid var(--line);
  position:sticky;top:0;z-index:40;
}
.burger{
  /* alvo de toque de 44px, medido */
  width:44px;height:44px;display:grid;place-items:center;
  border:1px solid var(--line-2);border-radius:var(--r-sm);background:var(--p-soft);
}
.burger span{display:block;width:16px;height:1.5px;background:var(--ink-1);
  box-shadow:0 -5px 0 var(--ink-1),0 5px 0 var(--ink-1)}
.topbar .tb-title{font-size:13px;font-weight:600;letter-spacing:-.03em;color:var(--ink-1)}

.backdrop{position:fixed;inset:0;background:rgba(26,21,12,.36);z-index:48;border:0}
.backdrop[hidden]{display:none}

.sidebar{
  position:fixed;top:0;left:0;bottom:0;width:min(88vw,var(--sidebar));
  background:var(--p-card);border-right:1px solid var(--line);
  display:flex;flex-direction:column;z-index:50;
  transform:translateX(-102%);transition:transform .22s ease;
  overflow-y:auto;overscroll-behavior:contain;
}
.sidebar.open{transform:none;box-shadow:var(--sh-2)}
@media(prefers-reduced-motion:reduce){.sidebar{transition:none}}

.main{padding:22px 16px 72px}

/* No desktop a sidebar deixa de ser gaveta e vira coluna fixa do grid. */
@media(min-width:980px){
  .topbar{display:none}
  .shell{display:grid;grid-template-columns:var(--sidebar) 1fr;min-height:100vh}
  .sidebar{position:sticky;height:100vh;transform:none;width:auto;box-shadow:none}
  .backdrop{display:none!important}
  .main{padding:38px 40px 96px;max-width:1180px}
}

/* ---- bloco de nivel, topo da sidebar ---- */
.nivel{padding:18px 18px 16px;border-bottom:1px solid var(--line);background:var(--p-soft)}
.nivel .n-lab{margin-bottom:8px}
.nivel .n-num{font-size:22px;font-weight:600;letter-spacing:-.045em;color:var(--ink-1);line-height:1.1}
.nivel .n-sub{font-size:11.5px;color:var(--ink-4);margin-top:12px;display:flex;
  justify-content:space-between;align-items:baseline;gap:8px}
.nivel .n-pct{font-family:var(--mono);font-size:12px;color:var(--accent);font-weight:700}
.bar{height:6px;border-radius:99px;background:var(--p-ember);overflow:hidden;margin-top:7px;
  border:1px solid var(--line)}
.bar > i{display:block;height:100%;background:var(--accent-fill);border-radius:99px;
  transition:width .35s ease}
.nivel .n-falta{font-size:11.5px;color:var(--ink-4);margin-top:9px}

/* ---- navegacao ---- */
.nav{padding:12px 10px;flex:1}
.nav button{
  display:flex;align-items:center;gap:10px;width:100%;
  min-height:44px;padding:0 12px;border-radius:var(--r-sm);
  font-size:14px;letter-spacing:-.02em;color:var(--ink-2);text-align:left;
  border:1px solid transparent;
}
.nav button:hover{background:var(--p-soft)}
/* "claro nitido": o item ativo marca ZONA com --accent-soft e borda, nao so cor de texto */
.nav button[aria-current="page"]{
  background:var(--accent-soft);border-color:var(--line-2);
  color:var(--ink-1);font-weight:600;
}
.nav .dot{width:5px;height:5px;border-radius:99px;background:var(--ink-5);flex:none}
.nav button[aria-current="page"] .dot{background:var(--accent)}

/* ---- rodape da sidebar ---- */
.perfil{padding:14px;border-top:1px solid var(--line);display:flex;gap:10px;align-items:flex-start;
  background:var(--p-soft)}
.avatar{width:34px;height:34px;flex:none;border-radius:9px;background:var(--accent-soft);
  border:1px solid var(--line-2);display:grid;place-items:center;
  font-weight:600;color:var(--accent);font-size:14px;letter-spacing:-.02em}
.perfil .p-mail{font-size:12px;color:var(--ink-2);word-break:break-all;line-height:1.35}
.perfil .p-plano{font-size:11px;color:var(--accent);margin-top:3px;line-height:1.35;font-weight:500}

/* =========================================================================
   COMPONENTES
   ========================================================================= */
/* breadcrumb: e navegacao de verdade, cada pedaco anterior e clicavel.
   O portal do Joao mostra sempre o mesmo curso aqui. Esse bug nao foi copiado. */
.crumb{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:12px;
  color:var(--ink-4);margin-bottom:16px}
.crumb button{color:var(--accent);font-size:12px;padding:2px 0}
.crumb button:hover{text-decoration:underline}
.crumb .sep{color:var(--ink-5)}
.crumb .cur{color:var(--ink-3)}

.card{background:var(--p-card);border:1px solid var(--line);border-radius:var(--r);
  box-shadow:var(--sh-1)}
/* "claro nitido": a borda do card e mais presente que o normal, tingida no ambar.
   Card branco sobre papel #FAF8F4 ja e hierarquia. Nao empilho sombra em cima. */
.card.nitido{border-color:var(--line-2)}

.badge{display:inline-flex;align-items:center;gap:6px;padding:4px 9px;border-radius:99px;
  font-size:11px;font-weight:600;letter-spacing:-.01em;border:1px solid transparent;white-space:nowrap}
/* badge usa --accent em texto sobre --accent-soft, nunca fill cheio.
   O ambar solido aparece UMA VEZ por contexto, e e onde o aluno avanca. */
.b-ok{background:rgba(63,125,78,.10);color:var(--ok);border-color:rgba(63,125,78,.24)}
.b-prog{background:var(--accent-soft);color:var(--accent);border-color:var(--line-2)}
.b-off{background:var(--p-warm);color:var(--ink-4);border-color:var(--line)}
.b-lock{background:var(--p-warm);color:var(--ink-3);border-color:var(--line)}
.b-herd{background:var(--accent-soft);color:var(--accent);border-color:var(--line-2)}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;
  min-height:44px;padding:0 18px;border-radius:var(--r-sm);
  font-size:14px;font-weight:600;letter-spacing:-.02em;border:1px solid var(--line-2);
  background:var(--p-card);color:var(--ink-1);transition:background .15s ease}
.btn:hover{background:var(--p-soft)}
/* o unico fill solido de ambar da tela, e so onde o aluno AVANCA */
.btn.pri{background:var(--accent-fill);color:var(--btn-text);border-color:#D9B855}
.btn.pri:hover{background:#F0D689}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn[disabled]:hover{background:var(--p-card)}
.btn.pri[disabled]:hover{background:var(--accent-fill)}
.btn.sm{min-height:38px;padding:0 13px;font-size:13px}
.btn.gh{background:transparent;border-color:var(--line);color:var(--ink-3);font-weight:500}
.btn.gh:hover{background:var(--p-soft);color:var(--ink-2)}

.wash{background:var(--accent-soft);border:1px solid var(--line-2);border-radius:var(--r-sm);
  padding:14px 16px}
.nota{background:var(--p-soft);border:1px solid var(--line);border-left:3px solid var(--accent);
  border-radius:var(--r-sm);padding:13px 15px;font-size:13.5px;color:var(--ink-3);line-height:1.62}

.grid-2{display:grid;gap:14px}
@media(min-width:760px){.grid-2{grid-template-columns:repeat(2,1fr)}}

/* =========================================================================
   TELA: SUA ROTA
   ========================================================================= */
.head{margin-bottom:24px}
.head .h1{margin-bottom:8px}
.head p{color:var(--ink-3);font-size:15px;max-width:60ch}

.jornada{display:block;width:100%;text-align:left;padding:18px;border-radius:var(--r);
  background:var(--p-card);border:1px solid var(--line-2);box-shadow:var(--sh-1);
  transition:box-shadow .18s ease,transform .18s ease}
.jornada:hover{box-shadow:var(--sh-2)}
.jornada.trava{background:var(--p-soft);border-color:var(--line);box-shadow:none}
.j-top{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;margin-bottom:10px}
.j-nome{font-size:17px;font-weight:600;letter-spacing:-.035em;color:var(--ink-1);line-height:1.28}
.j-desc{font-size:13.5px;color:var(--ink-3);line-height:1.6;margin-bottom:14px}
.j-foot{display:flex;justify-content:space-between;align-items:center;gap:12px;
  padding-top:12px;border-top:1px solid var(--line);font-size:12px;color:var(--ink-4)}
.j-pct{font-family:var(--mono);font-weight:700;color:var(--accent);font-size:13px}

/* =========================================================================
   TELA: TRILHA (lista de etapas + coluna direita)
   ========================================================================= */
.trilha-wrap{display:grid;gap:22px}
@media(min-width:1040px){
  /* coluna da direita fixa em 288px: e painel de estado, nao conteudo */
  .trilha-wrap{grid-template-columns:1fr 288px;align-items:start}
  .trilha-side{position:sticky;top:28px}
}

.mod-head{display:flex;flex-wrap:wrap;gap:10px;align-items:center;
  margin:26px 0 12px;padding-bottom:10px;border-bottom:1px solid var(--line-2)}
.mod-head:first-child{margin-top:0}
.mod-head .m-nome{font-size:13px;font-weight:600;letter-spacing:-.02em;color:var(--ink-1)}

.etapa{display:flex;gap:14px;width:100%;text-align:left;padding:16px;margin-bottom:10px;
  background:var(--p-card);border:1px solid var(--line-2);border-radius:var(--r);
  box-shadow:var(--sh-1);transition:box-shadow .18s ease}
.etapa:hover{box-shadow:var(--sh-2)}
.etapa.done{background:var(--p-soft)}
/* "claro nitido": numero de etapa grande e em --accent. E o que da leitura
   rapida da posicao na trilha sem precisar ler titulo. */
.e-num{font-family:var(--mono);font-size:26px;font-weight:700;color:var(--accent);
  line-height:1;flex:none;width:42px;padding-top:2px;letter-spacing:-.02em}
.etapa.done .e-num{color:var(--ink-5)}
.e-body{flex:1;min-width:0}
.e-top{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:6px}
.e-tit{font-size:15px;font-weight:600;letter-spacing:-.03em;color:var(--ink-1);line-height:1.35}
.e-desc{font-size:13.5px;color:var(--ink-3);line-height:1.6}
.e-prog{display:inline-flex;align-items:center;gap:7px;margin-top:10px;
  background:var(--accent-soft);border:1px solid var(--line-2);border-radius:99px;
  padding:3px 10px;font-size:11px;font-weight:600;color:var(--accent)}

.side-box{background:var(--p-card);border:1px solid var(--line-2);border-radius:var(--r);
  padding:18px;box-shadow:var(--sh-1);margin-bottom:14px}
.side-frac{font-size:40px;font-weight:600;letter-spacing:-.055em;color:var(--ink-1);
  line-height:1;font-family:var(--mono)}
.side-frac em{font-style:normal;color:var(--ink-4);font-size:26px}
.side-lab{font-size:12px;color:var(--ink-4);margin-top:6px}
.prox{display:block;width:100%;text-align:left;margin-top:14px;padding:12px 13px;
  background:var(--accent-soft);border:1px solid var(--line-2);border-radius:var(--r-sm)}
.prox:hover{background:#F1DFB0}
.prox .p-lab{font-size:11px;color:var(--accent);font-weight:600;margin-bottom:3px}
.prox .p-nome{font-size:13.5px;font-weight:600;color:var(--ink-1);letter-spacing:-.025em;line-height:1.35}
.links-rap{display:flex;flex-direction:column;gap:2px;margin-top:8px}
.links-rap button{min-height:40px;text-align:left;font-size:13.5px;color:var(--accent);padding:0 2px}
.links-rap button:hover{text-decoration:underline}

/* =========================================================================
   TELA: ETAPA (abas)
   ========================================================================= */
.etapa-head{margin-bottom:20px}
.eh-top{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:12px}
.eh-num{font-family:var(--mono);font-size:12px;font-weight:700;color:var(--accent);
  background:var(--accent-soft);border:1px solid var(--line-2);border-radius:99px;padding:4px 11px}
.etapa-head .h2{margin-bottom:10px}
.etapa-head p{color:var(--ink-3);max-width:66ch}

/* abas: o conjunto VARIA por etapa. Teorica tem 2, produtiva tem 4.
   A barra rola no eixo x dentro dela mesma, o body nunca rola. */
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line-2);margin-bottom:22px;
  overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs button{min-height:44px;padding:0 15px;font-size:14px;font-weight:500;
  letter-spacing:-.025em;color:var(--ink-4);white-space:nowrap;
  border-bottom:2px solid transparent;margin-bottom:-1px;border-radius:var(--r-sm) var(--r-sm) 0 0}
.tabs button:hover{color:var(--ink-2);background:var(--p-soft)}
.tabs button[aria-selected="true"]{color:var(--ink-1);font-weight:600;
  border-bottom-color:var(--accent);background:var(--accent-soft)}
.tabs button .tk{display:inline-block;margin-left:7px;font-size:11px;color:var(--ok)}

/* player: placeholder HONESTO. Nenhuma aula foi gravada ainda, e a tela diz isso. */
.player{aspect-ratio:16/9;width:100%;border-radius:var(--r);background:var(--p-warm);
  border:1px solid var(--line-2);display:grid;place-items:center;text-align:center;padding:24px}
.player .pl-in{max-width:44ch}
.player .pl-t{font-size:13.5px;font-weight:600;color:var(--ink-2);letter-spacing:-.025em;
  margin-bottom:6px}
.player .pl-d{font-size:12.5px;color:var(--ink-4);line-height:1.6}

.pontos{list-style:none;padding:0;margin:14px 0 0}
.pontos li{position:relative;padding-left:20px;margin-bottom:9px;font-size:14px;
  color:var(--ink-2);line-height:1.62}
.pontos li::before{content:"";position:absolute;left:3px;top:9px;width:6px;height:6px;
  border-radius:99px;background:var(--accent)}

.mat{display:flex;gap:12px;align-items:flex-start;padding:15px;
  background:var(--p-card);border:1px solid var(--line);border-radius:var(--r-sm)}
.mat .m-ico{width:38px;height:38px;flex:none;border-radius:9px;background:var(--p-warm);
  border:1px solid var(--line);display:grid;place-items:center;
  font-family:var(--mono);font-size:9.5px;font-weight:700;color:var(--ink-3);letter-spacing:.04em}
.mat .m-n{font-size:14px;font-weight:600;color:var(--ink-1);letter-spacing:-.025em;line-height:1.35}
.mat .m-d{font-size:12.5px;color:var(--ink-4);margin-top:3px;line-height:1.55}

.campo{display:block;margin-bottom:14px}
.campo .c-lab{display:block;font-size:13px;font-weight:600;color:var(--ink-2);
  letter-spacing:-.02em;margin-bottom:6px}
.campo .c-help{display:block;font-size:12px;color:var(--ink-4);margin-bottom:7px;line-height:1.5}
.campo input,.campo textarea{width:100%;min-height:44px;padding:11px 13px;
  background:var(--p-card);border:1px solid var(--line-2);border-radius:var(--r-sm);
  font-size:14.5px;color:var(--ink-1)}
.campo textarea{min-height:120px;resize:vertical;line-height:1.6}
.campo input:focus,.campo textarea:focus{outline:2px solid var(--accent);outline-offset:1px;
  border-color:var(--accent)}

.regua-out{background:var(--p-gold);border:1px solid var(--line-2);border-radius:var(--r);
  padding:20px;margin-top:6px}
.ro-lab{margin-bottom:8px}
.ro-val{font-family:var(--mono);font-size:clamp(28px,7vw,42px);font-weight:700;
  letter-spacing:-.05em;color:var(--ink-1);line-height:1}
.ro-sub{font-size:12.5px;color:var(--ink-3);margin-top:10px;line-height:1.6}
.ro-linha{display:flex;justify-content:space-between;gap:12px;font-size:13px;
  padding:7px 0;border-top:1px solid var(--line)}
.ro-linha span:last-child{font-family:var(--mono);color:var(--ink-2);white-space:nowrap}

.check{display:flex;gap:11px;align-items:flex-start;padding:13px;margin-bottom:8px;
  background:var(--p-card);border:1px solid var(--line);border-radius:var(--r-sm);
  cursor:pointer;min-height:44px}
.check:hover{background:var(--p-soft)}
.check input{width:20px;height:20px;flex:none;margin:2px 0 0;accent-color:var(--accent)}
.check span{font-size:13.5px;color:var(--ink-2);line-height:1.6}

.trava{background:var(--p-soft);border:1px dashed var(--line-2);border-radius:var(--r);

/* =========================================================================

   ========================================================================= */
function temProduto(pid){return ALUNO.produtos.indexOf(pid)>=0}

function prateleiraLiberada(pr){
  for(var i=0;i<pr.liberadoPor.length;i++){if(temProduto(pr.liberadoPor[i]))return true}
  return false;
}
/* qual produto do aluno abre esta prateleira (pra dizer na interface de onde veio) */
function produtoQueAbre(pr){
  for(var i=0;i<pr.liberadoPor.length;i++){if(temProduto(pr.liberadoPor[i]))return PRODUTOS[pr.liberadoPor[i]]}
  return null;
}
/* o produto de menor degrau que ja dava acesso. E isso que revela HERANCA. */
function produtoDeOrigem(pr){
  var ordem=['p1','p2','p6'];
  for(var i=0;i<ordem.length;i++){
    if(pr.liberadoPor.indexOf(ordem[i])>=0 && temProduto(ordem[i])) return PRODUTOS[ordem[i]];
  }
  return null;
}
function ehHerdado(pr){
  /* herdado = o modulo ja vinha de um produto anterior ao plano mais alto do aluno */
  var origem=produtoDeOrigem(pr);
  var topo=planoTopo();
  return !!(origem && topo && origem.id!==topo.id);
}
function planoTopo(){
  var ordem=['p6','p2','p1'];
  for(var i=0;i<ordem.length;i++){if(temProduto(ordem[i]))return PRODUTOS[ordem[i]]}
  return null;
}
function prog(id){return PROGRESSO[id]||(PROGRESSO[id]={abas:{},concluida:false})}
function statusAula(id){
  var p=PROGRESSO[id];
  if(p&&p.concluida)return 'concluida';
  if(p&&Object.keys(p.abas).length>0)return 'progresso';
  return 'nao';
}
function rotuloStatus(s){return s==='concluida'?'Concluido':(s==='progresso'?'Em progresso':'Nao iniciado')}
function classeStatus(s){return s==='concluida'?'b-ok':(s==='progresso'?'b-prog':'b-off')}
function abasFeitas(a){
  var p=PROGRESSO[a.id],c=0;

  for(var i=0;i<a.abas.length;i++){if(p.abas[a.abas[i]])c++}
  return c;
}
function aulasDaPrateleira(pr){return MODULOS[pr.modulo].aulas}
function concluidasDa(lista){
  var c=0;for(var i=0;i<lista.length;i++){if(statusAula(lista[i].id)==='concluida')c++}
  return c;
}
function todasAulasDoAluno(){
  var vistos={},out=[];
  PRATELEIRAS.forEach(function(pr){
    if(!prateleiraLiberada(pr))return;
    aulasDaPrateleira(pr).forEach(function(a){if(!vistos[a.id]){vistos[a.id]=1;out.push(a)}});
  });
  return out;
}
function nivelDoAluno(){
  /* 6 aulas por nivel. Numero de regra interna do portal, nao e numero de negocio. */
  var POR=6, c=concluidasDa(todasAulasDoAluno());
  return {nivel:Math.floor(c/POR)+1, pct:Math.round((c%POR)/POR*100), falta:POR-(c%POR), feitas:c};
}
function proximaAula(pr){
  var l=aulasDaPrateleira(pr);
  for(var i=0;i<l.length;i++){if(statusAula(l[i].id)!=='concluida')return l[i]}
  return null;
}
function aulaPorId(id){
  var k,i;
  for(k in MODULOS){for(i=0;i<MODULOS[k].aulas.length;i++){if(MODULOS[k].aulas[i].id===id)return MODULOS[k].aulas[i]}}
  return null;
}

/* ---------- A REGUA DO LANCE, o mecanismo da casa ----------
   lance + (lance * taxa) + remocao + doc + reparos + lucro = revenda
   logo: teto = (revenda - remocao - doc - reparos - lucro) / (1 + taxa/100)
   O "lucro" vem de Meus Materiais. Mudar la muda o teto aqui.           */
function num(v){
  if(v===undefined||v===null)return 0;
  var s=String(v).replace(/\./g,'').replace(',','.').replace(/[^0-9.\-]/g,'');
  var n=parseFloat(s);return isNaN(n)?0:n;
}
function calcRegua(){
  var L=MATERIAIS.lote, revenda=num(L.revenda), taxa=num(L.taxa),
      custos=num(L.remocao)+num(L.doc)+num(L.reparos), lucro=num(MATERIAIS.empresa.lucroAlvo);
  var teto=(revenda-custos-lucro)/(1+taxa/100);
  return {revenda:revenda,taxa:taxa,custos:custos,lucro:lucro,
          teto:teto,valido:revenda>0&&teto>0};
}
function brl(n){
  return 'R$ '+Math.round(n).toLocaleString('pt-BR');
}

/* ---- ABA FINALIZE: e TRAVA, nao conteudo ---- */
function abaFinalize(a){
  var p=prog(a.id);
  var faltam=a.abas.filter(function(k){return k!=='finalize'&&!p.abas[k]});
  var nomes=faltam.map(function(k){return '"'+NOME_ABA[k]+'"'}).join(' e ');

  if(faltam.length===0){
    var temEntrega=a.construa?true:false;

      '<div class="wash"><div class="h3" style="color:var(--ink-1)">Tudo o que esta etapa pedia esta feito</div>'+
      '<p style="margin-top:8px;font-size:13.5px;color:var(--ink-2)">'+
      (temEntrega?'Salve o resultado em Meus Materiais pra que as ferramentas leiam dele.'

      '<div class="acoes">'+
        (temEntrega?'<button class="btn pri" data-finalizar="salvar">Salvar em Meus Materiais</button>':
                    '<button class="btn pri" data-finalizar="escape">Marcar como concluida</button>')+
        (temEntrega?'<button class="btn gh" data-finalizar="escape">Marcar como concluida assim mesmo</button>':'')+
      '</div>'+
      '<div class="aviso" id="avisoFin" aria-live="polite">'+
      (p.concluida?'<span class="ok">Etapa concluida.'+(p.salvo?' Entrega salva em Meus Materiais.':'')+'</span>':'')+'</div>'+
      (p.concluida?'<div class="acoes"><button class="btn gh sm" data-nav="mat">Ver em Meus Materiais</button>'+
        botaoProxima(a)+'</div>':'')+
      '</div>';
  }

  return '<div style="max-width:70ch">'+
    '<div class="trava">'+
    '<div class="h3" style="color:var(--ink-1)">Ainda nao da pra finalizar</div>'+
    '<p style="margin-top:8px;font-size:13.5px;color:var(--ink-3)">Para finalizar esta etapa, voce precisa primeiro '+
    'completar '+(faltam.length>1?'as abas':'a aba')+' '+nomes+'.</p>'+
    '</div>'+
    '<div class="acoes">'+
    '<button class="btn pri" disabled>Salvar em Meus Materiais</button>'+
    '<button class="btn gh" data-finalizar="escape">Marcar como concluida assim mesmo</button>'+
    '</div>'+

function botaoProxima(a){
  var pr=PRATELEIRAS.filter(function(x){return x.id===state.prateleira})[0];
  var lista=[];
  if(pr.modulo==='mj'&&temProduto('p2')){lista=MODULOS.m1.aulas.concat(MODULOS.mj.aulas)}
  else{lista=aulasDaPrateleira(pr)}
  var i=-1,j;
  for(j=0;j<lista.length;j++){if(lista[j].id===a.id){i=j;break}}
  if(i<0||i>=lista.length-1)return '';
  return '<button class="btn sm" data-aula="'+lista[i+1].id+'">Proxima etapa</button>';

/* =========================================================================
   TELA: MEUS MATERIAIS, o repositorio compartilhado
   ========================================================================= */
function materiaisProduzidos(){
  /* DERIVADO do PROGRESSO, nunca de uma lista paralela.
     Se a etapa deixar de estar concluida, o material some junto. Sem fantasma. */
  var out=[];
  for(var k in MODULOS){
    MODULOS[k].aulas.forEach(function(a){
      var p=PROGRESSO[a.id];
      if(!a.construa||!p||!p.concluida||!p.salvo)return;
      out.push({nome:a.construa.titulo,modulo:MODULOS[k].nome,etapa:a.n,aulaId:a.id});
    });
  }
  return out;
}

/* Re-render SO do painel da aba, sem tocar no resto da tela. */
function renderPainel(){
  var a=aulaPorId(state.aulaId);
  var pan=document.querySelector('[role="tabpanel"]');
  pan.id='pan-'+state.aba;
  pan.setAttribute('aria-labelledby','tab-'+state.aba);
  pan.innerHTML=painelAba(a,state.aba);
  document.querySelectorAll('.tabs [role="tab"]').forEach(function(b){
    var sel=b.dataset.aba===state.aba;
    b.setAttribute('aria-selected',sel);b.tabIndex=sel?0:-1;
  });
}
/* atualiza so os ticks das abas e o badge de status, sem redesenhar o painel
   (nao pode redesenhar: o cursor do aluno pode estar dentro de um input) */
function refreshChrome(){
  var a=aulaPorId(state.aulaId),p=prog(a.id);
  document.querySelectorAll('.tabs [role="tab"]').forEach(function(b){
    var k=b.dataset.aba, tick=b.querySelector('.tk');
    if(p.abas[k]&&!tick){
      var s=document.createElement('span');s.className='tk';s.setAttribute('aria-label','aba concluida');
      s.innerHTML='&#10003;';b.appendChild(s);
    }else if(!p.abas[k]&&tick){tick.remove()}
  });
  var badge=el('stBadge');
  if(badge){var s=statusAula(a.id);badge.className='badge '+classeStatus(s);badge.textContent=rotuloStatus(s)}
  renderSidebar();
}

   EVENTOS
   ========================================================================= */
function abrirMenu(){el('sidebar').classList.add('open');el('backdrop').hidden=false;
  el('burger').setAttribute('aria-expanded','true');el('sidebar').focus()}
function fecharMenu(){el('sidebar').classList.remove('open');el('backdrop').hidden=true;
  el('burger').setAttribute('aria-expanded','false')}

el('burger').addEventListener('click',function(){
  el('sidebar').classList.contains('open')?fecharMenu():abrirMenu();
});
el('backdrop').addEventListener('click',fecharMenu);
document.addEventListener('keydown',function(e){if(e.key==='Escape')fecharMenu()});

/* clique global: navegacao e acoes */
document.addEventListener('click',function(e){
  var b=e.target.closest('button');if(!b)return;

  if(b.dataset.nav){ir(b.dataset.nav);return}

  if(b.dataset.pr){
    var pr=PRATELEIRAS.filter(function(x){return x.id===b.dataset.pr})[0];
    ir('trilha',{prateleira:pr.id});return;
  }

  if(b.dataset.aula){
    var id=b.dataset.aula;
    /* descobre a prateleira de origem se o clique veio de fora da trilha */
    if(!state.prateleira||!aulaNaPrateleira(id,state.prateleira)){
      state.prateleira=prateleiraDaAula(id);
    }
    ir('etapa',{aulaId:id,aba:null});return;
  }

  if(b.dataset.aba){escolherAba(b.dataset.aba);return}

  if(b.dataset.marcar){
    var a=aulaPorId(state.aulaId),p=prog(a.id);
    p.abas[b.dataset.marcar]=true;
    avisar('Aula marcada como assistida.');
    renderPainel();refreshChrome();return;
  }
  if(b.dataset.desmarcar){
    var a2=aulaPorId(state.aulaId),p2=prog(a2.id);
    delete p2.abas[b.dataset.desmarcar];
    /* reabrir uma aba derruba a conclusao E o material salvo junto.
       Material salvo de etapa reaberta vira fantasma em Meus Materiais. */
    p2.concluida=false;p2.salvo=false;
    avisar('Aula desmarcada. A etapa voltou para em progresso.');
    renderPainel();refreshChrome();return;
  }

  if(b.dataset.guardar){guardarConstrua();return}
  if(b.dataset.finalizar){finalizar(b.dataset.finalizar);return}
  if(b.dataset.baixar){baixarRegua();return}

  if(b.dataset.mm){state.mmFiltro=b.dataset.mm;render();return}

  if(b.id==='limparLote'){
    CAMPOS_LOTE.forEach(function(f){MATERIAIS.lote[f.k]=''});
    MATERIAIS.lote.lance='';
    renderPainel();avisar('Campos do lote limpos.');return;
  }

  if(b.id==='fbEnviar'){
    var txt=el('fbTxt').value.trim(),av=el('avisoFb');
    if(!txt){av.className='aviso err';av.textContent='Escreva alguma coisa antes de enviar.';
      avisar('Feedback vazio, nao foi enviado.');el('fbTxt').focus();return}
    MATERIAIS.feedbacks.unshift({texto:txt,quando:'Agora, nesta sessao'});
    avisar('Feedback enviado.');render();
    var a3=el('avisoFb');if(a3){a3.className='aviso ok';a3.textContent='Feedback enviado. Ele fica nesta sessao.'}
    return;
  }
});

function aulaNaPrateleira(aulaId,prId){
  var pr=PRATELEIRAS.filter(function(x){return x.id===prId})[0];
  if(!pr)return false;
  var l=aulasDaPrateleira(pr);
  if(pr.modulo==='mj'&&temProduto('p2'))l=MODULOS.m1.aulas.concat(MODULOS.mj.aulas);
  return l.some(function(a){return a.id===aulaId});
}
function prateleiraDaAula(aulaId){
  for(var i=0;i<PRATELEIRAS.length;i++){
    var pr=PRATELEIRAS[i];
    if(!prateleiraLiberada(pr))continue;
    if(aulasDaPrateleira(pr).some(function(a){return a.id===aulaId}))return pr.id;
  }
  return 'pr1';
}

function escolherAba(k){
  state.aba=k;renderPainel();
  var t=document.getElementById('tab-'+k);if(t)t.focus();
}

/* tablist com seta, exigencia de acessibilidade */
document.addEventListener('keydown',function(e){
  var t=e.target;
  if(!t.closest||!t.closest('.tabs'))return;
  if(t.getAttribute('role')!=='tab')return;
  var a=aulaPorId(state.aulaId);if(!a)return;
  var i=a.abas.indexOf(state.aba),n=null;
  if(e.key==='ArrowRight')n=a.abas[(i+1)%a.abas.length];
  else if(e.key==='ArrowLeft')n=a.abas[(i-1+a.abas.length)%a.abas.length];
  else if(e.key==='Home')n=a.abas[0];
  else if(e.key==='End')n=a.abas[a.abas.length-1];
  if(n){e.preventDefault();escolherAba(n)}
});

/* ---------- INPUT: nunca re-renderiza o campo que esta sendo digitado ----------
   O valor vai pro estado e SO os blocos de saida sao reescritos.
   Reescrever o input enquanto a pessoa digita embaralha o numero. */
document.addEventListener('input',function(e){
  var t=e.target;

  if(t.dataset.campo){
    var p=t.dataset.campo.split(':');
    if(p[0]==='empresa'){MATERIAIS.empresa[p[1]]=t.value}
    else{MATERIAIS.lote[p[1]]=t.value}
    atualizarSaidas();
    return;
  }
  if(t.dataset.entrega){prog(t.dataset.entrega).entrega=t.value}
});

function atualizarSaidas(){
  ['reguaOut','reguaOutFerr'].forEach(function(id){
    var n=el(id);if(n)n.outerHTML=blocoRegua(id);
  });
  var av=el('avisoLance');
  if(av){
    var r=calcRegua(),l=num(MATERIAIS.lote.lance);
    if(!l){av.className='aviso';av.textContent=''}
    else if(!r.valido){av.className='aviso';av.textContent='Sem teto calculado na etapa 03 ainda.'}
    else if(l>r.teto){av.className='aviso err';
      av.textContent='Este lance esta '+brl(l-r.teto)+' acima do seu teto. A regua diz pra parar.'}
    else{av.className='aviso ok';av.textContent='Dentro do teto, com '+brl(r.teto-l)+' de folga.'}
  }
}

/* checkbox da aba Valide */
document.addEventListener('change',function(e){
  var t=e.target;
  if(t.dataset.check===undefined)return;
  var a=aulaPorId(state.aulaId),p=prog(a.id);
  p.check=p.check||{};
  p.check[t.dataset.check]=t.checked;
  var todos=a.valide.itens.every(function(_,i){return p.check[i]});
  if(todos)p.abas.valide=true;else{delete p.abas.valide;p.concluida=false;p.salvo=false}
  var av=el('avisoValide');
  if(av){
    av.className='aviso '+(todos?'ok':'');
    av.textContent=todos?'Aba Valide concluida.':'';
  }
  avisar(todos?'Aba Valide concluida.':'Aba Valide reaberta.');
  refreshChrome();
});

/* ---------- guardar a entrega da aba Construa ---------- */
function guardarConstrua(){
  var a=aulaPorId(state.aulaId),p=prog(a.id),av=el('avisoConstrua');
  var c=a.construa,ok=false,msg='';

  if(c.tipo==='regua'){
    var r=calcRegua();
    if(!r.valido){msg='Preencha ao menos o preco de revenda pra sair um teto.';}
    else{ok=true;msg='Teto guardado: '+brl(r.teto)+'. Ele passa a aparecer na etapa 05 e em Meus Materiais.'}
  }else if(c.tipo==='lance'){
    if(!num(MATERIAIS.lote.lance)){msg='Escreva o lance que voce deu antes de guardar.';}
    else{ok=true;msg='Lance guardado.'}
  }else{
    var v=(p.entrega||'').trim();
    if(!v){msg='O campo esta vazio. Escreva a sua entrega antes de guardar.';}
    else{ok=true;msg='Entrega guardada.'}
  }

  if(ok)p.abas.construa=true;
  if(av){av.className='aviso '+(ok?'ok':'err');av.textContent=msg}
  avisar(msg);
  if(!ok){
    var campo=document.querySelector('[data-entrega],[data-campo="lote:lance"],[data-campo="lote:revenda"]');
    if(campo)campo.focus();
  }
  refreshChrome();
}

/* ---------- Finalize ---------- */
function finalizar(modo){
  var a=aulaPorId(state.aulaId),p=prog(a.id),av;
  if(modo==='salvar'){
    p.concluida=true;p.salvo=true;
    avisar('Etapa concluida e entrega salva em Meus Materiais.');
  }else{
    p.concluida=true;
    /* escape: conclui sem entregar. O material NAO entra em Meus Materiais,
       porque ele nao existe. Progresso pode mentir, repositorio nao. */
    if(!p.abas.construa)p.salvo=false;
    avisar('Etapa marcada como concluida.');
  }
  renderPainel();refreshChrome();
  av=el('avisoFin');
  if(av){av.className='aviso ok';
    av.textContent=modo==='salvar'
      ? 'Etapa concluida. Entrega salva em Meus Materiais.'
      : 'Etapa concluida sem entrega. Nada foi salvo em Meus Materiais.';
  }
}

/* ---------- download real da Regua, gerado aqui na hora ---------- */
function baixarRegua(){
  var r=calcRegua(),L=MATERIAIS.lote;
  var linhas=[
    ['A Regua do Lance',''],
    ['Preco de revenda realista',L.revenda||''],
    ['Taxa do leiloeiro (%)',L.taxa||''],
    ['Remocao e patio',L.remocao||''],
    ['Documentacao e transferencia',L.doc||''],
    ['Reparos e revisao',L.reparos||''],
    ['Lucro que eu quero (de Meus Materiais)',MATERIAIS.empresa.lucroAlvo||''],
    ['',''],
    ['Meu teto de lance',r.valido?Math.round(r.teto):'']
  ];
  var csv='﻿'+linhas.map(function(l){return '"'+l[0]+'";"'+l[1]+'"'}).join('\r\n');
  var blob=new Blob([csv],{type:'text/csv;charset=utf-8'});
  var url=URL.createObjectURL(blob),a=document.createElement('a');
  a.href=url;a.download='regua-do-lance.csv';document.body.appendChild(a);a.click();
  document.body.removeChild(a);setTimeout(function(){URL.revokeObjectURL(url)},1000);
  avisar('Planilha da Regua baixada com os seus numeros.');
}

render();
